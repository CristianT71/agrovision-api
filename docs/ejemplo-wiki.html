<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki de café — ejemplo con la API pública de AgroVisión</title>
<style>
  :root {
    --verde: #1f5f3f; --verde-claro: #e8f3ec; --texto: #1d2a22; --suave: #5b6b61;
    --fondo: #f4f7f5; --tarjeta: #ffffff; --borde: #dce6df; --aviso: #b45309; --aviso-fondo: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --verde: #6fcf97; --verde-claro: #1c3326; --texto: #e6efe9; --suave: #9db0a4;
      --fondo: #101814; --tarjeta: #18221c; --borde: #2a3a30; --aviso: #fbbf24; --aviso-fondo: #3b2f0f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
  header { background: var(--verde); color: #fff; padding: 28px 16px; }
  @media (prefers-color-scheme: dark) { header { color: #0b1a12; } }
  .contenedor { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  header h1 { margin: 0; font-size: 1.7rem; }
  header p { margin: 6px 0 0; opacity: .9; }
  .barra { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px; }
  .barra input, .barra select { font: inherit; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 10px; background: var(--tarjeta); color: var(--texto); }
  .barra input[type=search] { flex: 1 1 220px; }
  .barra button { font: inherit; padding: 10px 16px; border: 0; border-radius: 10px; background: var(--verde); color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .barra button { color: #0b1a12; } }
  .api { margin: 4px 0 18px; font-size: .85rem; color: var(--suave); }
  .api label { display: block; margin-bottom: 4px; }
  .api input { width: 100%; font: .85rem ui-monospace, Consolas, monospace; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; background: var(--tarjeta); color: var(--texto); }
  .estado { padding: 14px 16px; border-radius: 12px; margin: 12px 0; background: var(--tarjeta); border: 1px solid var(--borde); }
  .estado.error { border-color: #dc2626; color: #dc2626; }
  .cuadricula { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; padding-bottom: 40px; }
  .ficha { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0; font: inherit; color: inherit; }
  .ficha:hover, .ficha:focus-visible { border-color: var(--verde); outline: none; }
  .foto { aspect-ratio: 4 / 3; background: var(--verde-claro); display: flex; align-items: center; justify-content: center; color: var(--suave); font-size: .85rem; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cuerpo { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .cuerpo h3 { margin: 0; font-size: 1.05rem; }
  .cientifico { font-style: italic; color: var(--suave); font-size: .9rem; min-height: 1.35em; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }
  .etiqueta { font-size: .75rem; padding: 2px 9px; border-radius: 999px; background: var(--verde-claro); color: var(--verde); }
  .etiqueta.sin-aval { background: var(--aviso-fondo); color: var(--aviso); }
  .resumen { font-size: .88rem; color: var(--suave); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(720px, calc(100vw - 24px)); max-height: 90vh; background: var(--tarjeta); color: var(--texto); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .detalle { padding: 20px 22px 22px; overflow: auto; max-height: 90vh; }
  .detalle img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; }
  .detalle h2 { margin: 0 0 2px; }
  .detalle h4 { margin: 18px 0 4px; color: var(--verde); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
  .detalle p { margin: 0; }
  .aviso { margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: var(--aviso-fondo); color: var(--aviso); font-size: .88rem; }
  .cerrar { float: right; border: 0; background: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--suave); }
  pre { background: var(--fondo); border: 1px solid var(--borde); border-radius: 10px; padding: 10px; overflow: auto; font-size: .78rem; }
  footer { text-align: center; color: var(--suave); font-size: .85rem; padding: 0 16px 30px; }
</style>
</head>
<body>
<header>
  <div class="contenedor">
    <h1>Wiki del café</h1>
    <p>Ejemplo de cómo otro proyecto consume la API pública de AgroVisión. Esta página no tiene servidor: solo usa <code>fetch</code>.</p>
  </div>
</header>

<main class="contenedor">
  <div class="barra">
    <input id="buscar" type="search" placeholder="Buscar por nombre, nombre científico o sinónimo…" aria-label="Buscar">
    <select id="tipo" aria-label="Tipo">
      <option value="">Todos los tipos</option>
      <option value="enfermedad">Enfermedades</option>
      <option value="plaga">Plagas</option>
      <option value="deficiencia">Deficiencias</option>
      <option value="sano">Hoja sana</option>
    </select>
    <button id="consultar" type="button">Consultar</button>
  </div>

  <div class="api">
    <label for="base">URL base de la API (cámbiala para probar contra otra, por ejemplo http://localhost:3000/api/public/v1/catalog)</label>
    <input id="base" value="https://agrovision.sbs/api/public/v1/catalog" spellcheck="false">
    <div id="peticion" style="margin-top:6px"></div>
  </div>

  <div id="estado" class="estado" hidden></div>
  <div id="resultado" class="cuadricula"></div>
</main>

<footer>Datos: API pública de AgroVisión · Una ficha sin aval no fue revisada por un agrónomo.</footer>

<dialog id="dialogo"><div class="detalle" id="detalle"></div></dialog>

<script>
  const $ = (id) => document.getElementById(id)
  const baseUrl = () => $('base').value.trim().replace(/\/+$/, '')

  // Construye nodos con textContent: nunca se inserta HTML que venga de la API
  function el(tag, props = {}, hijos = []) {
    const nodo = document.createElement(tag)
    Object.assign(nodo, props)
    for (const h of [].concat(hijos)) nodo.append(h)
    return nodo
  }

  function etiquetas(f) {
    const caja = el('div', { className: 'etiquetas' })
    caja.append(el('span', { className: 'etiqueta', textContent: f.tipo }))
    caja.append(el('span', { className: 'etiqueta' + (f.avalada ? '' : ' sin-aval'), textContent: f.avalada ? 'Avalada por agrónomo' : 'Sin aval' }))
    if (f.modelo) caja.append(el('span', { className: 'etiqueta', textContent: 'Modelo ' + f.modelo.desdeVersion }))
    return caja
  }

  function foto(f, clase) {
    if (!f.fotoUrl) return el('div', { className: clase, textContent: 'Sin foto todavía' })
    const caja = el('div', { className: clase })
    caja.append(el('img', { src: f.fotoUrl, alt: f.nombreComun, loading: 'lazy' }))
    return caja
  }

  function mostrarEstado(texto, error = false) {
    const caja = $('estado')
    caja.hidden = !texto
    caja.textContent = texto || ''
    caja.className = 'estado' + (error ? ' error' : '')
  }

  function dibujar(fichas) {
    const cuadricula = $('resultado')
    cuadricula.replaceChildren()
    for (const f of fichas) {
      const tarjeta = el('button', { className: 'ficha', type: 'button' }, [
        foto(f, 'foto'),
        el('div', { className: 'cuerpo' }, [
          el('h3', { textContent: f.nombreComun }),
          el('div', { className: 'cientifico', textContent: f.nombreCientifico || '' }),
          etiquetas(f),
          el('div', { className: 'resumen', textContent: f.sintomas }),
        ]),
      ])
      tarjeta.addEventListener('click', () => abrirDetalle(f.clave))
      cuadricula.append(tarjeta)
    }
  }

  async function consultar() {
    const params = new URLSearchParams()
    if ($('tipo').value) params.set('tipo', $('tipo').value)
    if ($('buscar').value.trim()) params.set('q', $('buscar').value.trim())
    const url = baseUrl() + (params.size ? '?' + params : '')
    $('peticion').textContent = 'GET ' + url

    mostrarEstado('Consultando…')
    $('resultado').replaceChildren()
    try {
      const respuesta = await fetch(url)
      if (respuesta.status === 429) throw new Error('Demasiadas peticiones (límite: 60 por minuto). Espera un momento.')
      if (!respuesta.ok) throw new Error('La API respondió ' + respuesta.status)
      const { total, fichas } = await respuesta.json()
      mostrarEstado(total === 0 ? 'Sin resultados para esa búsqueda.' : total + (total === 1 ? ' ficha' : ' fichas'))
      dibujar(fichas)
    } catch (e) {
      // "Failed to fetch" suele ser: sin internet, API apagada o URL mal escrita
      mostrarEstado('No se pudo consultar la API: ' + e.message, true)
    }
  }

  async function abrirDetalle(clave) {
    const contenido = $('detalle')
    contenido.replaceChildren(el('p', { textContent: 'Cargando…' }))
    $('dialogo').showModal()
    try {
      const respuesta = await fetch(baseUrl() + '/' + encodeURIComponent(clave))
      if (!respuesta.ok) throw new Error('La API respondió ' + respuesta.status)
      const f = await respuesta.json()

      const seccion = (titulo, texto) => (texto ? [el('h4', { textContent: titulo }), el('p', { textContent: texto })] : [])
      const nodos = [
        el('button', { className: 'cerrar', type: 'button', textContent: '×', ariaLabel: 'Cerrar', onclick: () => $('dialogo').close() }),
        ...(f.fotoUrl ? [el('img', { src: f.fotoUrl, alt: f.nombreComun })] : []),
        el('h2', { textContent: f.nombreComun }),
        el('div', { className: 'cientifico', textContent: f.nombreCientifico || '' }),
        etiquetas(f),
        ...seccion('Descripción', f.descripcion),
        ...seccion('Síntomas', f.sintomas),
        ...seccion('Órganos afectados', f.organosAfectados.join(', ')),
        ...seccion('Hospederos', f.hospederos.join(', ')),
        ...seccion('También se conoce como', f.sinonimos.join(', ')),
        ...seccion('Medidas de contención', f.medidasContencion),
        ...seccion('Protocolo químico', f.protocoloQuimico),
        ...seccion('Clase del modelo de IA', f.modelo ? f.modelo.clase + ' (desde la versión ' + f.modelo.desdeVersion + ')' : ''),
      ]
      if (!f.avalada) {
        nodos.push(el('div', { className: 'aviso', textContent: 'Esta ficha no fue revisada por un agrónomo: es información de apoyo, no una recomendación técnica. Las medidas y el protocolo químico solo se publican en fichas avaladas.' }))
      }
      nodos.push(el('h4', { textContent: 'Respuesta JSON de la API' }), el('pre', { textContent: JSON.stringify(f, null, 2) }))
      contenido.replaceChildren(...nodos)
    } catch (e) {
      contenido.replaceChildren(el('p', { textContent: 'No se pudo cargar la ficha: ' + e.message }))
    }
  }

  $('consultar').addEventListener('click', consultar)
  $('buscar').addEventListener('keydown', (e) => { if (e.key === 'Enter') consultar() })
  $('tipo').addEventListener('change', consultar)
  $('dialogo').addEventListener('click', (e) => { if (e.target === $('dialogo')) $('dialogo').close() })
  consultar()
</script>
</body>
</html>
